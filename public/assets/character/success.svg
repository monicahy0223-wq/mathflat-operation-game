<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- sparkle left -->
  <line x1="8" y1="8" x2="8" y2="15" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="4.5" y1="11.5" x2="11.5" y2="11.5" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- sparkle right -->
  <line x1="72" y1="6" x2="72" y2="13" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="68.5" y1="9.5" x2="75.5" y2="9.5" stroke="#fcd34d" stroke-width="2.2" stroke-linecap="round"/>
  <!-- star top center -->
  <polygon points="40,3 41.8,8.6 47.6,8.6 43,12 44.9,17.5 40,14.1 35.1,17.5 37,12 32.4,8.6 38.2,8.6" fill="#fbbf24"/>

  <!-- body -->
  <rect x="27" y="50" width="26" height="22" rx="11" fill="#34d399"/>
  <!-- body shine -->
  <ellipse cx="33" cy="54" rx="5" ry="2.5" fill="white" opacity="0.25" transform="rotate(-15,33,54)"/>

  <!-- head -->
  <circle cx="40" cy="36" r="19" fill="#fef3c7"/>
  <!-- head shine -->
  <ellipse cx="33" cy="27" rx="5" ry="3" fill="white" opacity="0.4" transform="rotate(-20,33,27)"/>

  <!-- cheeks -->
  <circle cx="28" cy="41" r="5" fill="#fca5a5" opacity="0.45"/>
  <circle cx="52" cy="41" r="5" fill="#fca5a5" opacity="0.45"/>

  <!-- eyes (happy ^ arcs) -->
  <path d="M31,34 Q34.5,28.5 38,34" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M42,34 Q45.5,28.5 49,34" stroke="#78350f" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- big smile -->
  <path d="M30,42 Q40,52 50,42" stroke="#78350f" stroke-width="2.2" fill="none" stroke-linecap="round"/>

  <!-- left arm raised -->
  <path d="M27,57 Q18,46 13,33" stroke="#34d399" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- left hand -->
  <circle cx="11" cy="30" r="6.5" fill="#fef3c7"/>

  <!-- right arm raised -->
  <path d="M53,57 Q62,46 67,33" stroke="#34d399" stroke-width="9" fill="none" stroke-linecap="round"/>
  <!-- right hand -->
  <circle cx="69" cy="30" r="6.5" fill="#fef3c7"/>

  <!-- legs -->
  <rect x="29" y="68" width="9" height="12" rx="4.5" fill="#10b981"/>
  <rect x="42" y="68" width="9" height="12" rx="4.5" fill="#10b981"/>
</svg>
